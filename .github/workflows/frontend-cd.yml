name: Frontend CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build (production)
        run: npm run build

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deployment
          path: frontend/dist/claims-module-web/browser
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Static Web App
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.resources.outputs.frontendUrl }}

    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-deployment
          path: site

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show target Azure account
        run: az account show -o table

      - name: Resolve Static Web App and deployment token
        id: resources
        run: |
          host=$(az staticwebapp show --resource-group "$RESOURCE_GROUP" --name "$STATIC_WEB_APP_NAME" --query defaultHostname -o tsv)
          token=$(az staticwebapp secrets list --resource-group "$RESOURCE_GROUP" --name "$STATIC_WEB_APP_NAME" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          {
            echo "frontendUrl=https://$host"
            echo "deploymentToken=$token"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.resources.outputs.deploymentToken }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        env:
          FRONTEND_URL: ${{ steps.resources.outputs.frontendUrl }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "$FRONTEND_URL/" | grep -q '<app-root' && curl -fsS "$FRONTEND_URL/claims" | grep -q '<app-root'; then
              echo "Frontend is live: $FRONTEND_URL"
              exit 0
            fi
            echo "Waiting for the frontend to be served ($attempt/30)..."
            sleep 10
          done
          echo "::error::Frontend was not served at $FRONTEND_URL"
          exit 1
