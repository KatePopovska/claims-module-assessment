name: claims-module

x-sql-connection: &sql-connection "Server=sqlserver,1433;Database=ClaimsModule;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    build:
      context: ./backend
      target: migrate
    command: ["--connection", *sql-connection]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: *sql-connection
    ports:
      - "5160:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
  uploads:
